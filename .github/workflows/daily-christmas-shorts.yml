name: 🎄 Funny Spitz Family - Série Especial de Natal (Shorts Diários)

on:
  schedule:
    # Roda todos os dias à 01:00 da madrugada (Horário de Brasília / 04:00 UTC)
    # Agenda o Short de Natal PT-BR para as 12:00 e o EN-US para as 20:00!
    - cron: "0 4 * * *"
  workflow_dispatch: # Permite disparar manualmente com 1 clique no GitHub

permissions:
  contents: write

jobs:
  produce-christmas-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 Baixar código do projeto
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 📦 Instalar dependências (FFmpeg, Sharp, Edge-TTS, Google APIs)
        run: |
          npm install
          node node_modules/ffmpeg-static/install.js

      - name: 🎄 Executar Ciclo Diário da Série Especial de Natal (PT + EN)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: node src/christmas-cycle.js

      - name: 💾 Salvar Progresso da Série de Natal no Repositório
        run: |
          git config user.name "Funny Spitz Christmas Bot"
          git config user.email "bot@funnyspitzfamily.local"
          git add config/christmas_history.json episodes/natal_ep*/*.json
          git diff --staged --quiet || git commit -m "chore(natal): registrar novo episódio da Série Especial de Natal"
          git push
